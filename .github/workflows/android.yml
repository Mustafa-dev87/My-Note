name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run prepare-www
      - run: npx cap add android
      - name: Generate launcher icons from icon-512.png
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('icon-512.png').convert('RGBA')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,s in sizes.items():
              p = f'android/app/src/main/res/mipmap-{d}'
              if not os.path.isdir(p): continue
              im = src.resize((s,s), Image.LANCZOS)
              for n in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  im.save(f'{p}/{n}')
          for f in ('mipmap-anydpi-v26/ic_launcher.xml','mipmap-anydpi-v26/ic_launcher_round.xml'):
              fp = f'android/app/src/main/res/{f}'
              if os.path.exists(fp): os.remove(fp)
          PY
      - name: Add Android permissions and notification icon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION VIBRATE; do
            grep -q "android.permission.$P\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\"/>\n</manifest>#" $M
          done
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          im = Image.new('RGBA', (96, 96), (0, 0, 0, 0))
          d = ImageDraw.Draw(im)
          d.ellipse((8, 8, 88, 88), outline=(255, 255, 255, 255), width=9)
          d.ellipse((36, 36, 60, 60), fill=(255, 255, 255, 255))
          os.makedirs('android/app/src/main/res/drawable', exist_ok=True)
          im.save('android/app/src/main/res/drawable/ic_stat_icon.png')
          PY
      - name: Add notification sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp mizan_ring.wav android/app/src/main/res/raw/mizan_ring.wav
          if [ -f adhan.mp3 ]; then cp adhan.mp3 android/app/src/main/res/raw/adhan.mp3; else cp mizan_ring.wav android/app/src/main/res/raw/adhan.wav; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mizan360-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
